<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>福瑞搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            /* 当前目录读取 1.jpg */
            background: url("./1.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* 背景磨砂遮罩 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: -1;
            pointer-events: none;
        }

        .search-wrap {
            width: min(820px, 96%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .logo-text {
            font-size: clamp(56px, 11vw, 108px);
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-align: center;
            text-shadow:
                0 8px 24px rgba(0, 0, 0, 0.45),
                0 2px 6px rgba(0, 0, 0, 0.25),
                0 0 40px rgba(255, 255, 255, 0.15);
            user-select: none;
        }

        /* 搜索框容器，下拉定位 */
        .search-box-wrapper {
            width: 100%;
            position: relative;
        }

        /* 扁搜索框，磨砂玻璃 */
        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.28),
                0 0 0 1px rgba(255, 255, 255, 0.25) inset,
                0 1px 0 rgba(255, 255, 255, 0.6) inset;
        }

        #search-input {
            flex: 1;
            padding: 12px 26px;
            border: none;
            outline: none;
            font-size: 18px;
            color: #1a1a1a;
            background: transparent;
            autocomplete: off;
        }

        #search-input::placeholder {
            color: #555;
        }

        #submit-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 999px;
            margin-right:8px;
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255,255,255,0.7);
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s ease;
        }
        #submit-btn:hover {
            background: rgba(255, 255, 255, 0.55);
            transform: translateY(-2px);
        }

        /* 下拉历史记录磨砂面板 */
        .history-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            border-radius:16px;
            background:rgba(255,255,255,0.24);
            backdrop-filter:blur(16px) saturate(150%);
            -webkit-backdrop-filter:blur(16px) saturate(150%);
            border:1px solid rgba(255,255,255,0.4);
            box-shadow:
                0 8px 24px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.55);
            padding:12px;
            display:none;
            z-index:999;
        }
        .history-item{
            padding:10px 12px;
            border-radius:10px;
            cursor:pointer;
            color:#222;
            transition:0.2s;
        }
        .history-item:hover{
            background:rgba(255,255,255,0.38);
        }
    </style>
</head>
<body>
    <div class="search-wrap">
        <div class="logo-text">福瑞搜索</div>

        <div class="search-box-wrapper">
            <div class="search-box">
                <input id="search-input" placeholder="输入搜索内容" type="text">
                <button id="submit-btn">搜索</button>
            </div>
            <div class="history-dropdown" id="historyDropdown"></div>
        </div>
    </div>

    <script>
        const MAX_RECORD = 5;
        const input = document.getElementById('search-input');
        const btn = document.getElementById('submit-btn');
        const dropdown = document.getElementById('historyDropdown');

        function getHistory(){
            let data = localStorage.getItem("furuSearchHistory");
            return data ? JSON.parse(data) : [];
        }

        function saveHistory(text){
            if(!text.trim()) return;
            let arr = getHistory();
            arr = arr.filter(item => item !== text);
            arr.push(text);
            if(arr.length > MAX_RECORD){
                arr.shift();
            }
            localStorage.setItem("furuSearchHistory", JSON.stringify(arr));
        }

        function renderDropdown(){
            const arr = getHistory();
            dropdown.innerHTML = "";
            if(arr.length === 0){
                dropdown.style.display = "none";
                return;
            }
            arr.forEach(item => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerText = item;
                div.onclick = function(){
                    input.value = item;
                    dropdown.style.display = "none";
                };
                dropdown.appendChild(div);
            });
            dropdown.style.display = "block";
        }

        //点击输入框弹出历史下拉
        input.addEventListener('focus', function(){
            renderDropdown();
        });

        //点击页面空白关闭下拉
        document.addEventListener('mousedown', function(e){
            if(!input.contains(e.target) && !dropdown.contains(e.target)){
                dropdown.style.display = "none";
            }
        });

        function goSearch(q){
            window.location.href = `https://cn.bing.com/search?q=${encodeURIComponent(q)}`;
        }

        btn.onclick = function(){
            const val = input.value.trim();
            if(!val) return;
            saveHistory(val);
            goSearch(val);
        };

        input.addEventListener('keydown', e => {
            if(e.key === 'Enter'){
                const val = input.value.trim();
                if(!val) return;
                saveHistory(val);
                goSearch(val);
            }
        });
    </script>
</body>
</html>
